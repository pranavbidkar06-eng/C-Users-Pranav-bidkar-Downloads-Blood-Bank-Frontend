<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | LifeLine</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="auth-page">
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card border-0 shadow-lg"><div class="card-body p-4 p-md-5">
<div class="text-center mb-4"><div class="display-5">🩸</div><h2 class="fw-bold">Welcome Back</h2><p class="text-muted">Login to your account</p></div>
<div id="loginAlert"></div>
<form id="loginForm">
<label class="form-label">Email</label><input id="email" type="email" class="form-control mb-3" placeholder="you@example.com" required>
<label class="form-label">Password</label><input id="password" type="password" class="form-control mb-3" placeholder="Enter password" required>
<label class="form-label">Role</label><select id="role" class="form-select mb-4"><option value="donor">Donor</option><option value="hospital">Hospital</option><option value="admin">Admin</option></select>
<button class="btn btn-danger w-100">Login</button>
</form>
<p class="text-center mt-4 mb-0">New user? <a href="register.html" class="text-danger">Create account</a></p>
<p class="text-center mt-2"><a href="index.html">← Back to home</a></p>
</div></div></div></div></div>
<script src="js/app.js"></script><script src="js/login.js"></script></body></html>
