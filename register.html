<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | LifeLine</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="auth-page">
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8">
<div class="card border-0 shadow-lg"><div class="card-body p-4 p-md-5">
<div class="text-center mb-4"><div class="display-5">🩸</div><h2 class="fw-bold">Create Account</h2><p class="text-muted">Join the blood donation network</p></div>
<div id="registerAlert"></div>
<form id="registerForm">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Full Name</label><input id="fullName" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input id="regEmail" type="email" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input id="phone" type="tel" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Role</label><select id="regRole" class="form-select"><option value="donor">Donor</option><option value="hospital">Hospital</option></select></div>
<div class="col-md-6" id="bloodGroupWrap"><label class="form-label">Blood Group</label><select id="bloodGroup" class="form-select"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div class="col-md-6"><label class="form-label">City</label><input id="city" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Password</label><input id="regPassword" type="password" class="form-control" minlength="6" required></div>
<div class="col-md-6"><label class="form-label">Confirm Password</label><input id="confirmPassword" type="password" class="form-control" minlength="6" required></div>
<div class="col-12"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="2" required></textarea></div>
</div>
<button class="btn btn-danger w-100 mt-4">Register</button>
</form>
<p class="text-center mt-4 mb-0">Already registered? <a href="login.html" class="text-danger">Login</a></p>
</div></div></div></div></div>
<script src="js/app.js"></script><script src="js/register.js"></script></body></html>
