<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Blood | LifeLine</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-danger"><div class="container"><a class="navbar-brand fw-bold" href="index.html">🩸 LifeLine</a></div></nav>
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8">
<div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h2 class="fw-bold mb-1">Blood Request</h2><p class="text-muted mb-4">Submit a request for blood units.</p><div id="requestAlert"></div>
<form id="requestForm"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Hospital Name</label><input id="hospitalName" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Contact Number</label><input id="contact" type="tel" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Blood Group</label><select id="requestGroup" class="form-select" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div class="col-md-6"><label class="form-label">Units Required</label><input id="units" type="number" min="1" max="20" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Required Date</label><input id="requiredDate" type="date" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Urgency</label><select id="urgency" class="form-select"><option>Normal</option><option>Urgent</option><option>Emergency</option></select></div>
<div class="col-12"><label class="form-label">Reason / Notes</label><textarea id="reason" rows="3" class="form-control" required></textarea></div>
</div><button class="btn btn-danger mt-4">Submit Blood Request</button></form>
</div></div></div></div></div><script src="js/app.js"></script><script src="js/request.js"></script></body></html>
